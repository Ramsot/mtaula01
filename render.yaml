services:
  - type: web
    name: mtaula-01
    runtime: docker
    plan: free
    repo: https://github.com/Ramsot/mtaula01
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PREFIX
        value: .
      - key: MODE
        value: public
      - key: OWNER_NAME
        value: Mtaula 01
      - key: OWNER_NUMBER
        sync: false
      - key: BOT_NAME
        value: Mtaula 01
      - key: GEMINI_KEY
        sync: false
      - key: OPENAI_KEY
        sync: false
      - key: WELCOME
        value: "true"
      - key: ANTILINK
        value: "true"
      - key: TIMEZONE
        value: Africa/Dar_es_Salaam
      - key: DEBUG_MODE
        value: "false"
