services:
  - type: web
    name: mtaula-01
    runtime: docker
    plan: free
    repo: https://github.com/Ramsot/mtaula01
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Persistent WhatsApp session — attach a Disk, or every redeploy forces
      # a full re-pair.
      - key: SESSION_DIR
        value: /data/auth_info_baileys
      # Accounts + device pairings — on the same persistent Disk so logins and
      # paired devices survive redeploys (no re-pairing after an update).
      - key: DATA_DIR
        value: /data/mtaula-data
      - key: PORT
        value: 10000
      - key: PREFIX
        value: .
      - key: MODE
        value: public
      - key: OWNER_NAME
        value: Mtaula 01
      - key: OWNER_NUMBER
        sync: false
      - key: BOT_NAME
        value: Mtaula 01
      - key: GEMINI_KEY
        sync: false
      - key: GROQ_KEY
        sync: false
      - key: OPENAI_KEY
        sync: false
      # Protects /api/reset and /api/pair from the public internet.
      - key: ADMIN_TOKEN
        sync: false
      - key: WELCOME
        value: "true"
      - key: ANTILINK
        value: "true"
      - key: TIMEZONE
        value: Africa/Dar_es_Salaam
      - key: DEBUG_MODE
        value: "false"

    disk:
      name: mtaula-session
      mountPath: /data
      sizeGB: 1
